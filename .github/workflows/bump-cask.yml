# Auto-bumps the Homebrew tap on every Clarity release.
#
# Trigger: publishing a release in THIS repo.
# It downloads the release ZIP, computes its sha256, and pushes an updated
# Casks/clarity.rb to hariprasad2512/homebrew-clarity.
#
# One-time setup (owner only): create a Personal Access Token with
# Contents read+write on the homebrew-clarity repo and save it as the
# TAP_TOKEN secret in THIS repo's Settings → Secrets → Actions.
# Until then this workflow fails at the "Update tap" step by design.

name: Bump Homebrew cask

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Download release ZIP + checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo hariprasad2512/Clarity \
            --pattern "*.zip" --dir /tmp/asset
          FILE="$(ls /tmp/asset/*.zip | head -1)"
          echo "FILE=$(basename "$FILE")" >> "$GITHUB_ENV"
          echo "SHA=$(shasum -a 256 "$FILE" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Update tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          rm -rf /tmp/tap
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hariprasad2512/homebrew-clarity.git" /tmp/tap
          cd /tmp/tap
          python3 - <<'EOF'
          import os, re
          p = "Casks/clarity.rb"
          s = open(p).read()
          ver, sha, fn = os.environ["VER"], os.environ["SHA"], os.environ["FILE"]
          s = re.sub(r'version "[^"]+"', f'version "{ver}"', s, count=1)
          s = re.sub(r'sha256 "[0-9a-f]+"', f'sha256 "{sha}"', s, count=1)
          s = re.sub(r"releases/download/[^/]+/[^\"]+", f"releases/download/v{ver}/{fn}", s, count=1)
          open(p, "w").write(s)
          EOF
          git config user.name "clarity-bot"
          git config user.email "clarity-bot@users.noreply.github.com"
          git add Casks/clarity.rb
          git commit -m "clarity ${VER}"
          git push origin main

  smoke-test:
    needs: bump
    runs-on: macos-latest
    steps:
      - name: Install from tap
        run: |
          brew tap hariprasad2512/clarity
          brew trust hariprasad2512/clarity
          brew install --cask clarity
      - name: Verify signature
        run: codesign --verify --deep --strict /Applications/Clarity.app
